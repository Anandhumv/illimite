<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your premium interior account</p>

        @if (errorMessage) {
        <div class="auth-error-banner">{{ errorMessage }}</div>
        }

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required
                    placeholder="name@example.com" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required
                    placeholder="••••••••" />
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading">
                {{ isLoading ? 'Signing In...' : 'Sign In' }}
            </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading">
            <img src="assets/google-icon.svg" alt="" class="google-icon" />
            Continue with Google
        </button>

        <p class="auth-footer">
            Don't have an account? <a routerLink="/register">Create one</a>
        </p>
    </div>
</div>
