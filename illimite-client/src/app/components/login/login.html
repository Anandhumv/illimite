<div class="auth-container">
  <div class="auth-card">
    <p class="auth-eyebrow">Account</p>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your premium interior account</p>

    @if (errorMessage) {
      <div class="auth-error-banner">{{ errorMessage }}</div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailField="ngModel"
          required
          email
          pattern="^[A-Za-z0-9._%+-]+@gmail\.com$"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
        />
        @if (emailField.invalid && (emailField.dirty || emailField.touched)) {
          <p class="field-error">Enter a valid Gmail address like name&#64;gmail.com.</p>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading">
      <img src="assets/google-icon.svg" alt="" class="google-icon" />
      Continue with Google
    </button>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
