<div class="auth-container">
  <div class="auth-card">
    <p class="auth-eyebrow">Account</p>
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join us to experience minimalist design curation</p>

    @if (errorMessage) {
      <div class="auth-error-banner">{{ errorMessage }}</div>
    }

    <form class="auth-form" (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailField="ngModel"
          required
          email
          pattern="^[A-Za-z0-9._%+-]+@gmail\.com$"
        />
        @if (emailField.invalid && (emailField.dirty || emailField.touched)) {
          <p class="field-error">Enter a valid Gmail address like name&#64;gmail.com.</p>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading || registerForm.invalid">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
